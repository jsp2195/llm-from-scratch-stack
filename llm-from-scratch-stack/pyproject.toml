[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-from-scratch-stack"
version = "0.1.0"
description = "Small but real end-to-end LLM training stack"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LLM Stack Contributors"}]
dependencies = [
  "torch>=2.3",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.24",
  "tqdm>=4.66",
  "tensorboard>=2.14",
  "tokenizers>=0.15",
]

[project.optional-dependencies]
datasets = ["datasets>=2.18"]
wandb = ["wandb>=0.16"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
