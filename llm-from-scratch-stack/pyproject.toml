[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-from-scratch-stack"
version = "0.1.0"
description = "Offline-first end-to-end LLM training stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.24",
  "tqdm>=4.66",
  "tensorboard>=2.15",
  "tokenizers>=0.15",
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.optional-dependencies]
datasets = ["datasets>=2.19"]
wandb = ["wandb>=0.17"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
