name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
        working-directory: llm-from-scratch-stack
      - run: ruff check .
        working-directory: llm-from-scratch-stack
      - run: pytest -q
        working-directory: llm-from-scratch-stack
