defaults:
  - model: gpt_small
  - data: toy
  - _self_

train:
  seed: 42
  device: cpu
  precision: fp32
  compile: false
  grad_clip: 1.0
  grad_accum_steps: 1
  micro_batch_size: 4
  max_steps: 200
  eval_interval: 50
  log_interval: 10
  save_interval: 50
  out_dir: runs
  run_name: pretrain
  resume_path: null
  max_eval_batches: 20
  deterministic: false
optim: {name: adamw, lr: 3e-4, betas: [0.9, 0.95], weight_decay: 0.1, eps: 1e-8}
sched: {name: warmup_cosine, warmup_steps: 20, min_lr: 0.1}
dist: {mode: single, backend: gloo, find_unused_params: false, fsdp_shard_strategy: FULL_SHARD, fsdp_cpu_offload: false, fsdp_mixed_precision: false}
log: {use_wandb: false, wandb_project: llmstack, jsonl: true, tensorboard: true}
tokenizer_path: artifacts/tokenizer_toy
enable_hf_datasets: false
