defaults:
  - model: gpt_small
  - data: toy
  - _self_

tokenizer_dir: artifacts/tokenizer_toy
out_dir: runs
use_wandb: false
project_name: llm-from-scratch-stack

train:
  seed: 42
  device: cuda
  precision: fp32
  compile: false
  grad_clip: 1.0
  grad_accum_steps: 1
  micro_batch_size: 8
  max_steps: 200
  eval_interval: 50
  log_interval: 10
  save_interval: 50
  out_dir: runs
  resume_path: null
  max_eval_batches: 50

data:
  train_path: data/toy/train.jsonl
  val_path: data/toy/val.jsonl
  format: jsonl
  text_field: text
  seq_len: 128
  pack_sequences: true
  num_workers: 0
  shuffle: true
  streaming: false

optim:
  name: adamw
  lr: 3e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  eps: 1e-8

sched:
  name: warmup_cosine
  warmup_steps: 50
  min_lr: 3e-5

dist:
  mode: single
  backend: nccl
  find_unused_params: false
  fsdp_shard_strategy: FULL_SHARD
  fsdp_cpu_offload: false
  fsdp_mixed_precision: true

eval:
  checkpoint_path: ""
  max_batches: 50
  report_name: eval_report.json

posttrain:
  sft:
    data_path: data/toy/sft.jsonl
    base_checkpoint: ""
    separator: "\n### Response:\n"
  dpo:
    data_path: data/toy/prefs.jsonl
    base_checkpoint: ""
    beta: 0.1
