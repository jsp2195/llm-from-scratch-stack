defaults:
  - pretrain
  - _self_

train:
  seed: 1337

sft:
  data_path: data/sft.jsonl        # replace with your real dataset
  base_checkpoint: ''              # required
  separator: ""                    # IMPORTANT: avoid duplicate header
  max_steps: 2000                  # 50 → useless, 2k+ needed
  batch_size: 8                    # good default for single GPU
